[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blockade"
version = "0.1.0"
description = "A transparent security proxy that intercepts and controls MCP tool calls between AI agents and servers"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ishaani Prashant (mindxflayer)" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "httpx>=0.24.0,<1.0.0",
    "docker>=6.1.0,<8.0.0",
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn>=0.22.0,<1.0.0",
    "rich>=13.0.0,<14.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "structlog>=23.1.0,<25.0.0",
    "anyio>=3.7.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0"
]

[project.scripts]
blockade = "mcp_firewall.main:cli"
